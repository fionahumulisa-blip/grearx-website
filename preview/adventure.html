<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boundlessy — Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7fc;color:#15213d;font-family:system-ui,-apple-system,sans-serif}.top{background:#111e38;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:white;text-decoration:none}.brand{font:27px Georgia,serif}.wrap{max-width:1100px;margin:0 auto;padding:48px 22px}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:#6667b5}h1{font:clamp(42px,6vw,70px) Georgia,serif;margin:14px 0}p{line-height:1.6;color:#65708b}.intro{font-size:20px;max-width:690px}.studio{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}.panel{background:white;border:1px solid #e5e7f0;border-radius:22px;padding:25px;box-shadow:0 12px 30px #121c3c08}.panel h2{font:27px Georgia,serif;margin-top:0}textarea{width:100%;height:130px;padding:17px;border:1px solid #cbd1e0;border-radius:14px;resize:vertical;font:17px system-ui}.btn{border:0;background:#6b69de;color:white;border-radius:12px;padding:13px 20px;margin-top:14px;cursor:pointer}.btn:disabled{opacity:.5}.suggest{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.suggest button{border:1px solid #cbd1e0;border-radius:30px;background:white;padding:9px 12px;cursor:pointer}.result{white-space:pre-wrap;line-height:1.7;color:#273450}.muted{color:#737d96;font-size:14px}.next{display:none;margin-top:15px}.preview{font-size:12px;color:#5559a5;background:#ececff;padding:9px 14px;border-radius:9px;display:inline-block}@media(max-width:760px){.studio{grid-template-columns:1fr}.wrap{padding-top:28px}}</style></head><body><header class="top"><a class="brand" href="/preview/">◒ Boundlessy.</a><a href="/preview/">← All adventures</a></header><main class="wrap"><span class="preview">New experience preview · Existing site unchanged</span><div class="eyebrow" id="category" style="margin-top:32px"></div><h1 id="title"></h1><p class="intro" id="description"></p><div class="studio"><section class="panel"><h2 id="askTitle"></h2><p id="instruction"></p><div class="suggest" id="suggest"></div><form id="form"><textarea id="input" maxlength="1800" required></textarea><button class="btn" id="go">Let's go ↗</button></form></section><section class="panel"><h2 id="outputTitle">Your workspace</h2><div class="result" id="result"><p>Start with an idea. This space will come alive with your choices.</p></div><div class="next" id="next"><button class="btn" id="again">Take it further ↗</button></div></section></div></main><script>
const config={explore:{title:"Idea Explorer",category:"Follow a mystery",description:"Take a question apart, discover surprises, and decide what to investigate next.",ask:"What makes you curious?",instruction:"A big question, a tiny mystery, or something you've always wondered.",examples:["Why does the sky change color?","Could people live underwater?","Why do we dream?"],system:"Help the student explore their question. Offer two surprising hypotheses or explanations, distinguish facts from uncertainty, and end with one question that invites them to investigate evidence. Do not lecture."},create:{title:"Create Lab",category:"Make the impossible possible",description:"Start with a spark. Shape it into a story, design, invention, or something nobody has seen before.",ask:"What do you wish existed?",instruction:"Describe an invention, world, game, or story you'd love to create.",examples:["A solar-powered backpack","A game set in Kigali in 2050","A city in the clouds"],system:"Be a creative collaborator. Help turn the student's concept into a concrete prototype they can actually make or describe. Offer two imaginative directions, then a small first version. Ask the student to choose."},solve:{title:"Solve Together",category:"Change something real",description:"Find a challenge around you. Explore what causes it and test a solution.",ask:"What would you like to change?",instruction:"Think about a challenge in your school, community, or the world.",examples:["Too much plastic waste","Water shortages at school","Food spoiling before sale"],system:"Be a thoughtful problem-solving collaborator. Help the student identify who is affected, ask what evidence they have, propose two possible solutions with tradeoffs, and suggest one small, safe real-world test."},world:{title:"World Room",category:"Go beyond the familiar",description:"Visit possible futures, unfamiliar places, and big ideas through questions and imagination.",ask:"Where should we go?",instruction:"Choose a place, a time, a culture, or an imagined world.",examples:["Rwanda in the year 2100","What is life like in Antarctica?","A day on Mars"],system:"Be a curious guide to real or speculative worlds. Clearly distinguish established facts from imagination. Create a vivid short scene, introduce two discoveries and let the student choose where to go next."}};
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),mode=config[params.get("mode")]?params.get("mode"):"explore",c=config[mode];$("title").textContent=c.title;$("category").textContent=c.category;$("description").textContent=c.description;$("askTitle").textContent=c.ask;$("instruction").textContent=c.instruction;$("input").placeholder=c.examples[0];$("outputTitle").textContent=mode==="create"?"Your creation":mode==="solve"?"Your solution":mode==="world"?"Your journey":"Your discoveries";const initial=params.get("idea");if(initial)$("input").value=initial;c.examples.forEach(x=>{const b=document.createElement("button");b.textContent=x;b.type="button";b.onclick=()=>{$("input").value=x;$("input").focus()};$("suggest").append(b)});let history=[];async function run(q){$("go").disabled=true;$("result").textContent="Thinking with you…";$("next").style.display="none";try{const r=await fetch("/api/quest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:c.system+"\nStudent says: "+q,history:history.slice(-8)})});const d=await r.json();if(!r.ok||!d.answer)throw Error(d.error||"The adventure couldn't load.");$("result").textContent=d.answer;history.push({role:"user",content:q},{role:"assistant",content:d.answer});$("next").style.display="block"}catch(e){$("result").textContent="We couldn't reach Byte right now. Try again in a moment."}finally{$("go").disabled=false}}$("form").onsubmit=e=>{e.preventDefault();const q=$("input").value.trim();if(q)run(q)};$("again").onclick=()=>{$("input").value="";$("input").placeholder="What would you like to try next?";$("input").focus()};</script></body></html>
